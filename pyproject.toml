[project]
name = "cs50-final-project"
version = "0.1.0"
description = "A terminal-based Python navigation simulator where a robot moves through a 2D grid arena from a start point to a goal while avoiding obstacles and walls."
readme = "README.md"
authors = [
    { name = "Shabir Ahmad", email = "shabirahmad.tech@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.2.0",
]

[project.scripts]
cs50-final-project = "cs50_final_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
